name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # better-sqlite3 (devDependency dos testes) exige Node 22+ no npm ci
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Company Manager ${{ github.ref_name }}'
          releaseBody: |
            ## Company Manager ${{ github.ref_name }}

            Baixe o instalador para o seu sistema operacional abaixo.

            - **macOS (Apple Silicon):** `.dmg` — aarch64
            - **macOS (Intel):** `.dmg` — x86_64
            - **Windows:** `.msi` ou `.exe`
            - **Linux:** `.AppImage` ou `.deb`

            > Sem certificado de assinatura, o sistema pode exibir aviso de "desenvolvedor não identificado". Aprove manualmente na primeira execução.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
