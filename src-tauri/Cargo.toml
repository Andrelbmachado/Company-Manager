[package]
name = "company-manager"
version = "0.1.0"
description = "Company Manager - Plataforma empresarial modular"
authors = ["André Machado"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
# Agendas por link iCal (src/lib/calendar/fetcher.ts): o pedido sai do Rust, sem o bloqueio de CORS do webview.
# Travado na 2.6.1 no Cargo.lock: a 2.7+ exige tauri 2.12 (o app está no 2.11).
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# Hash de senha (comandos hash_password/verify_password). "std" liga o OsRng para gerar o sal.
argon2 = { version = "0.5", features = ["std"] }
# Mesmo sqlx do tauri-plugin-sql: corrige o checksum de bancos do protótipo antes do plugin aplicar as migrations.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate"] }
# Backup e restauração (src/backup.rs): API de backup do SQLite (mesma libsqlite3-sys do tauri-plugin-sql) e o .cmbackup (zip).
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
zip = { version = "2.6", default-features = false, features = ["deflate"] }

# Instalação própria no macOS (updater.rs): troca o .app com backup ao lado e rollback (mesmas versões do plugin).
[target.'cfg(target_os = "macos")'.dependencies]
tar = "0.4"
flate2 = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Sem otimização o argon2 leva segundos por login no `tauri dev`; otimizado, fica em dezenas de milissegundos.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# O strip do perfil release corrompe o LINKEDIT dos dylibs de proc-macro com o ld atual do macOS; só o app final fica stripped.
[profile.release.build-override]
strip = "none"
